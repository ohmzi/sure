valuation:
  name: Manual valuation
  date: <%= 4.days.ago.to_date %>
  amount: 4995
  currency: USD
  account: depository
  entryable_type: Valuation
  entryable: one

trade:
  name: Purchase 10 shares of AAPL
  date: <%= 1.day.ago.to_date %>
  amount: 2140 # 10 shares * $214 per share
  currency: USD
  account: investment
  entryable_type: Trade
  entryable: one

transaction:
  name: Starbucks
  date: <%= 1.day.ago.to_date %>
  amount: 10
  currency: USD
  account: depository
  entryable_type: Transaction
  entryable: one

transfer_out:
  name: Payment to credit card account
  date: <%= 3.days.ago.to_date %>
  amount: 100
  currency: USD
  account: depository
  entryable_type: Transaction
  entryable: transfer_out

transfer_in:
  name: Payment received from checking account
  date: <%= 3.days.ago.to_date %>
  amount: -100
  currency: USD
  account: credit_card
  entryable_type: Transaction
  entryable: transfer_in

# The neutral transaction entry the provenance resolver's specs start from
# (Milestone B, Tasks 5/6/9): no import, no provider source, no document link,
# and an amount (25) that does not match the `understood_receipt_link` read
# (12.00), so a spec can set it to match or diverge at will.
transaction_entry:
  name: Provenance subject
  date: <%= 6.days.ago.to_date %>
  amount: 25
  currency: USD
  account: depository
  entryable_type: Transaction
  entryable: transaction_entry

# The hand-entered counterpart the AI-posted filter and the undo guard need
# (Milestone B Task 9; flagged as missing since Task 5). By construction this
# row has no import, no provider `source` and no document link, so it can only
# ever read "entered by you": the audit filter must leave it out, and undo must
# refuse it. The date sits in the previous month so it stays out of the current
# month's budget and report totals.
depository_transaction:
  name: Hand-entered coffee
  date: <%= 40.days.ago.to_date %>
  amount: 7
  currency: USD
  account: depository
  entryable_type: Transaction
  entryable: depository_transaction
