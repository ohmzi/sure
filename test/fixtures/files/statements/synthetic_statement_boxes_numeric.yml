# The numeric/ungrouped counterpart of `synthetic_statement_boxes.yml` (cleanup
# item 3): the SAME box layout — the rung reads boxes only — but every date is
# the numeric form and every amount is printed ungrouped. Two boxes the OCR has
# MERGED across a column boundary exercise the widened scan probes:
#
#   * "09/14 FakeShop.ca TORONTO ON"  — a NUMERIC leading date glued into the
#     posting-date/description box, split off by `Geometry::LEADING_DATE`;
#   * "TEST MART MISSISSAUGA ON 1234.00" — an UNGROUPED amount glued onto the
#     description, split off by `Geometry::TRAILING_MONEY` (the old grouped-only
#     pattern could not match "1234.00", so this row was rejected and the scan
#     fell back).
#
# Boxes only (page text empty) so the rung cannot cheat by reading `page.text`;
# the statement's totals are injected by the test, as in the sibling fixtures.
# Self-consistent: one payment (credit 100.00), one purchases row of 100.00 and
# one of 1234.00 (purchases/charges 1334.00), opening 1000.00, new balance 2234.00.
