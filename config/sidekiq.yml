concurrency: <%= ENV.fetch("RAILS_MAX_THREADS") { 3 } %>
queues:
  - [scheduled, 10] # For cron-like jobs (e.g. "daily market data sync")
  - [high_priority, 4]
  - [medium_priority, 2]
  # The native read (DocumentUnderstandingJob): OCR + one vision call per
  # document, minutes at a time. Its own queue so one slow document cannot stall
  # the medium-priority lane, and a worker actually drains it.
  - [heavy, 2]
  - [low_priority, 1]
  - [default, 1]
