en:
  documents:
    hold_actions:
      retry: Try again
      retry_local: Retry with local model
      retry_online: Retry with online AI
      delete: Delete this copy
      open_settings: Set up a reader
    index:
      title: Documents
      receipts_bills_title: Receipts & Bills
      upload: Upload
      source_auto: Detect automatically
    # The floating + and its Add sheet (Documents redesign, 2026-10-16), and
    # the status line the intake stream writes refusals into. Dropping a file
    # anywhere on the page still uploads it.
    intake_bar:
      add_document: Add document
      title: Add a document
      subtitle: "Statements, receipts or bills: Sure reads them for you."
      cancel: Cancel
      scan: Scan
      photos: Photos
      choose_file: Files
      currency_label: Receipt currency
      footnote: Statements use their account's currency. On a computer, drop files anywhere on the page.
      upload_failed: The upload failed. Check your connection and try again.
    # The one dropzone's endpoint copy.
    intakes:
      create:
        duplicate: This document is already in your archive.
        invalid_file: That file could not be uploaded.
    create:
      queued: Document queued for processing.
      held: The upload is held on this server; retry it once processing is available.
    # The document's own page — the viewer without the dialog (Task 4).
    show:
      back: Back to documents
    # The native read refuses to mint a statement vault row for an uploader who
    # may not manage statements (Task 2). Because the intake no longer asks the
    # user what a document is, this reason lands on the document's own row — the
    # document is still read, archived and visible, unlike the old tile's
    # "not authorized" redirect that discarded the upload.
    held:
      statement_permission: Your document was saved, but only a household admin or member can manage statements, so it was not filed in the statement vault.
    link:
      linked: Document linked to the entry.
      unlinked: Document unlinked from the entry.
    retry:
      queued: Retrying the upload.
    destroy:
      removed: Document removed.
      blocked: "This document is linked to transactions that are not reconciled yet, so it cannot be removed: %{entries}. Reconcile or remove those first."
    card:
      retry: Retry
      remove: Remove
    duplicate:
      title: Duplicate document
      description: These bytes are already in your archive. The existing copy was kept and nothing new was added.
      back: Back to documents
    source:
      receipt: Receipt
      bill: Bill
      statement: Statement
      other: Other
    status:
      queued: Queued
      processing: Processing
      unlinked: Unlinked
      suggested: Suggested
      pending_review: Pending review
      linked: Linked
      verified: Verified
      dismissed: Dismissed
      failed: Failed
    # The per-document "what I understood" panel (Milestone B, design D4; spec
    # §9). It shows the read *and* its doubts — every field with its confidence,
    # the validator results, and what the document became — and, when there is no
    # read, the reason plus the two ways forward rather than an empty panel.
    understanding:
      attempt_outcomes:
        read: Read it
        skipped_busy: "Skipped: the GPU was busy"
        timed_out: Took too long
        failed: Could not read it
        did_not_add_up: Its transactions did not add up
      attempt_seconds:
        one: "%{count}s"
        other: "%{count}s"
      read_history: How it was read
      title: What I understood
      read: What it read
      checks: Checks
      became: It became
      confidence: "%{percent}% confident"
      check_this: check this
      not_checkable: Not checkable
      no_account: No account yet
      nothing_yet: Nothing became of this document yet.
      draft: Draft
      entry: Entry
      # `empty_reason`'s fallback when the read itself carries no stated error:
      # one line per extraction status, so a non-succeeded read always says why.
      not_read_yet: Not read yet
      pending: Still reading
      succeeded: Read
      failed: The read failed
      # A read in flight (the tile's "Reading…"): it is working, not unread, and
      # it offers nothing to configure.
      reading: Reading…
      reading_reason: This document is being read. Its details will appear here when the read finishes.
      # The field rows the panel shows ("what it read"), one leaf per verdict key
      # it knows (DocumentPanel::FIELD_LABEL_KEYS). Same wording the panel rendered
      # before the labels moved here.
      field_labels:
        document_class: type
        institution_name: institution
        account_last4: account last4
        card_last4: card last4
        card_network: card network
        currency: currency
        total: total
        date: date
        payee: payee
      # The check labels the panel renders (DocumentPanel::CHECK_LABEL_KEYS and
      # STATEMENT_CHECK_LABEL_KEYS). One leaf per validator result; the wording is
      # exactly what the panel showed before it moved here.
      check_labels:
        statement_rows_signs_verified: Payments and charges have the right signs (checked against the statement's totals)
        totals_agree: OCR and AI agree on the total
        line_items_sum: the line items add up to the total
        last4_in_ocr: the card or account number was found in the page text
        date_parses: the date reads as a date
        statement_rows_from_line_items: the statement rows were read from the line items field
        statement_rows_have_dates: every statement row has a date
        statement_totals_reconcile: the statement's rows add up to its own totals
        statement_rows_missing_dates: no statement row is missing its date
        statement_row_count: the reader found the statement's rows
      # Where the statement's rows came from, keyed by the read's
      # `statement_rows_source` (DocumentPanel::SOURCE_LABEL_KEYS). `fallback`
      # names a rung the panel does not recognise, so an unknown source still says
      # how the rows were read rather than rendering a raw key.
      source_labels:
        text_layer: the rows were read from the statement's own text layer
        geometry: the rows were read from the statement's layout
        vision: the rows were read by the AI, checked against the statement's totals
        fallback: the statement's rows were read
      # The draft's own state, in the words a person reads (outcomes' detail).
      state:
        awaiting_ocr: Still reading
        needs_understanding: Needs your input
        understood: Ready to review
      # The unread state's two ways forward: let the app read it, or key it in
      # yourself. Never a dead end. "Set up a provider" names its destination —
      # the owner's report (2026-10-13) was that the key fields had no findable
      # home, so the panel says exactly where they are.
      unread:
        set_up_provider: Set up a provider
        or: or
        enter_by_hand: Enter it by hand
        provider_location: "Find the key under Settings → Self-Hosting → AI provider (add a DeepSeek or OpenAI key, or pick a local model)."
  # DocumentIntake: the content router's copy. A file it cannot place is refused
  # with this message on the bar; nothing is archived.
  document_holds:
    ladder: "%{attempts}. Nothing was imported."
    statement_duplicate: "Duplicate of %{file}: the same month for the same account was already uploaded. Nothing from this copy was posted; delete it when you're ready."
    read_error:
      invalid: "Sure read this document but couldn't save the %{record} it produced (a value it read was not valid). Nothing was imported. Try again, or enter it by hand."
      unexpected: "An unexpected error (%{kind}) stopped the read. Nothing was imported. Try again."
    no_reader_configured: No AI reader is set up, so this document could not be read. Add a local model or a cloud key in Settings.
    attempts:
      skipped_busy: "%{reader} was skipped because the GPU was busy with another model"
      timed_out: "%{reader} took longer than its time limit"
      did_not_add_up: "%{reader}'s transactions did not add up to the statement's totals"
      failed:
        unavailable: "%{reader} is overloaded right now"
        quota: "%{reader} is out of quota"
        key: "%{reader} rejected its API key"
        other: "%{reader} could not read it"
  document_reader_ladder:
    local: the local model (%{model})
  document_intake:
    rejected: We could not tell what this file is. Drop a photo, a PDF, or a bank export.
