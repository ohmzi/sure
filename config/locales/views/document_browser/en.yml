en:
  document_browser:
    filters:
      search_placeholder: Search by text, title or file name
      # The type facet (Milestone B, design D1): one page, the type as a chip.
      type: Type
      types:
        all: All
        statements: Statements
        receipts_bills: Receipts & Bills
      # The status / review / extraction facet controls (M8 Task 9, Ruling
      # M8-L2).
      status: Status
      review: Review
      extraction: Extraction
      extraction_states:
        not_attempted: Not read
        processing: Reading
        extracted: Read
        extraction_failed: Read failed
      tags: Tags
      no_tags: No tags yet
      merchant: Merchant
      merchant_placeholder: Name
      institution: Institution
      institution_placeholder: Institution name
      amount_min: Min amount
      amount_max: Max amount
      statements_amount_note: "No amount filter: statements have no extracted total."
      sorts:
        newest: Newest first
        oldest: Oldest first
        document_date: Document date
        name: Name
      date_from: From date
      date_to: To date
    empty:
      title: Nothing matches these filters
      description: Try widening or clearing the filters.
      clear_filters: Clear filters
      documents_title: No documents yet
      documents_description: Upload a receipt or bill above and it will appear here once processed.
      statements_title: No statements yet
      statements_description: Upload a statement above and it will appear here once processed.
    row:
      retry: Retry
      remove: Remove
      extraction:
        processing: Extracting…
        extraction_failed: Extraction failed
    # The one Documents page's tile states (Milestone B, design D3). Each
    # derives from a field the row factory already carries.
    tile:
      states:
        reading: Reading…
        review: Review
        which_account: Which account?
        needs_you: Needs you
        posted: Posted
    # The "needs you" strip (design D5). It does not render at all when the
    # count is zero.
    attention:
      title:
        one: 1 document needs you
        other: "%{count} documents need you"
      reasons:
        couldnt_read:
          one: 1 couldn't be read
          other: "%{count} couldn't be read"
        needs_account:
          one: 1 needs an account
          other: "%{count} need an account"
        ready:
          one: 1 ready to review
          other: "%{count} ready to review"
      show: Show them
    viewer:
      previous: Previous
      next: Next
      download: Download
      unavailable_title: No preview yet
      unavailable_description: This document has no copy in the app yet. Open it again once processing has finished.
      unsupported_title: No in-page preview for this file
      unsupported_description: This file type cannot be previewed in the browser. Download it to open it in an app.
