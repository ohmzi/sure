# Pin both bridge subnets: the host's Docker address pools are exhausted, so
# these networks cannot be allocated one automatically. They are the same two
# subnets the previous stack held, so the old networks must be removed before
# `up` — otherwise Docker refuses with "Pool overlaps with other one on this
# address space" and the stack never comes up.
networks:
  default:
    ipam:
      config:
        - subnet: 10.88.0.0/24
  internal:
    ipam:
      config:
        - subnet: 10.89.0.0/24
