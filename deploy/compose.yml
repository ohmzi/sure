# OhmzBudget deploy stack — the Rails app plus the internal OCR sidecar. (The
# paperless-ngx services were removed in Milestone A; their volumes stay on disk.)
name: ohmzbudget

x-app-env: &app_env
  SELF_HOSTED: "true"
  ONBOARDING_STATE: "${ONBOARDING_STATE:-invite_only}"
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "${RAILS_ASSUME_SSL:-true}"
  DB_HOST: db
  DB_PORT: "5432"
  POSTGRES_USER: "${POSTGRES_USER:-sure_user}"
  POSTGRES_DB: "${POSTGRES_DB:-sure_production}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
  REDIS_URL: "redis://redis:6379/1"
  # The document store (uploaded bytes held until a read consumes them).
  # This MUST stay at the existing /rails/storage/paperless-staged: document
  # rows store ABSOLUTE paths, so moving the root would strand every already-read
  # document (Staging.resolve! rejects them, #file 404s). The directory rename is
  # deferred to Milestone B, where the files and the stored paths move together
  # (Ruling R25).
  OHMZBUDGET_DOCUMENT_STORE_DIR: "${OHMZBUDGET_DOCUMENT_STORE_DIR:-/rails/storage/paperless-staged}"
  # The OCR sidecar contract. The sidecar is internal-only, so web/worker must
  # join its network to reach it.
  OCR_SERVICE_URL: "${OCR_SERVICE_URL:-http://ocr:9000}"

# Hardening shared by the stateless services.
x-app-hardening: &app_hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Hardening for the postgres service: it still needs these caps to chown
# the data dir and drop to the postgres user during entrypoint init.
x-db-hardening: &db_hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID

# Hardening for images that start as root and drop privileges inside their
# entrypoint (redis): dropping ALL caps breaks them — verified:
# `redis:7-alpine` exits with "setpriv: setresuid failed: Operation not
# permitted" under `--cap-drop ALL`, so SETUID/SETGID must be re-added.
x-drop-hardening: &drop_hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - SETGID
    - SETUID

services:
  web:
    image: ohmzbudget:local
    build:
      context: ..
      dockerfile: Dockerfile
    command: ./bin/rails server
    ports:
      - "127.0.0.1:7300:3000"
    volumes:
      - app-storage:/rails/storage
    environment:
      <<: *app_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    <<: *app_hardening
    mem_limit: 1g
    networks:
      - default
      - internal

  worker:
    image: ohmzbudget:local
    build:
      context: ..
      dockerfile: Dockerfile
    command: bundle exec sidekiq
    volumes:
      - app-storage:/rails/storage
    environment:
      <<: *app_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'sidekiq' > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    <<: *app_hardening
    mem_limit: 1g
    networks:
      - default
      - internal

  # The heavy lane: DocumentUnderstandingJob (OCR + one vision call per
  # document) runs for minutes at a time. Its own worker keeps a 40-page
  # statement from occupying a slot the mailer and the syncs need.
  worker-heavy:
    image: ohmzbudget:local
    build:
      context: ..
      dockerfile: Dockerfile
    command: bundle exec sidekiq -q heavy
    volumes:
      - app-storage:/rails/storage
    environment:
      <<: *app_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'sidekiq' > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    <<: *app_hardening
    mem_limit: 2g
    networks:
      - default
      - internal

  db:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-sure_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-sure_production}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *db_hardening
    mem_limit: 1g
    networks:
      - default

  redis:
    image: redis:7-alpine   # version-pinned: deterministic broker/cache for Sidekiq
    volumes:
      - redis-data:/data
    read_only: true          # tolerated: only /data (volume) and /tmp (tmpfs) are written
    tmpfs:
      - /tmp
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *drop_hardening
    mem_limit: 256m
    networks:
      - default

  # --- OCR sidecar (M-A): PaddleOCR behind a small HTTP contract ---
  # Internal-only: no `ports:` block, exactly like the paperless services it
  # replaces. web/worker join the `internal` network to reach it.
  ocr:
    build:
      context: ../ocr
    container_name: ocr
    environment:
      OCR_LANG: ${OCR_LANG:-en}
      OCR_DPI: ${OCR_DPI:-300}
    # The same hardening as the app services, and it matters more here: this is
    # the one container parsing UNTRUSTED PDFs and images through native code
    # (poppler, PaddleOCR, PIL). The GPU arrives via the device reservation below,
    # which needs no capabilities, so dropping ALL is safe.
    <<: *app_hardening
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s   # the first model load is slow

volumes:
  app-storage:
  postgres-data:
  redis-data:

networks:
  default:
    name: ohmzbudget_default
  internal:
    name: ohmzbudget_internal
    internal: true
